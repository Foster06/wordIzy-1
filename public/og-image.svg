<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="wordIzy — Word Unscrambler &amp; Anagram Solver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#1a1a1f"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#ffc56e"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffd58a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient brand glow -->
  <circle cx="980" cy="120" r="220" fill="#f5a623" opacity="0.10"/>
  <circle cx="180" cy="540" r="200" fill="#ffc56e" opacity="0.07"/>

  <!-- Logo: amber square with white W -->
  <g filter="url(#softShadow)">
    <rect x="100" y="100" width="92" height="92" rx="20" fill="url(#brandGrad)"/>
    <text x="146" y="162" font-family="Roboto Slab, Georgia, serif" font-size="56" font-weight="700" fill="#1a1a1f" text-anchor="middle">W</text>
  </g>
  <text x="208" y="158" font-family="Roboto Slab, Georgia, serif" font-size="44" font-weight="700" fill="#ffffff">
    word<tspan fill="#f5a623">Izy</tspan>
  </text>
  <text x="208" y="186" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#a1a1aa">
    Unscramble. Solve. Win.
  </text>

  <!-- Main title -->
  <text x="100" y="320" font-family="Roboto Slab, Georgia, serif" font-size="68" font-weight="800" fill="url(#textGrad)">
    Word Unscrambler &amp;
  </text>
  <text x="100" y="395" font-family="Roboto Slab, Georgia, serif" font-size="68" font-weight="800" fill="url(#textGrad)">
    Anagram Solver
  </text>

  <!-- Subtitle -->
  <text x="100" y="450" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#d4d4d8">
    Free  •  9 languages  •  Official Scrabble dictionaries
  </text>

  <!-- Get Started button -->
  <g filter="url(#softShadow)">
    <rect x="100" y="500" width="240" height="64" rx="14" fill="url(#brandGrad)"/>
    <text x="220" y="540" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#1a1a1f" text-anchor="middle">
      Get Started →
    </text>
  </g>

  <!-- Tool pills on right -->
  <g font-family="Inter, system-ui, sans-serif" font-size="16" fill="#e5e5e5">
    <rect x="760" y="295" width="180" height="44" rx="10" fill="#ffffff" opacity="0.06"/>
    <text x="850" y="322" text-anchor="middle">Anagram Solver</text>
    <rect x="950" y="295" width="150" height="44" rx="10" fill="#ffffff" opacity="0.06"/>
    <text x="1025" y="322" text-anchor="middle">Wordle</text>
    <rect x="760" y="350" width="200" height="44" rx="10" fill="#ffffff" opacity="0.06"/>
    <text x="860" y="377" text-anchor="middle">Quordle Solver</text>
    <rect x="970" y="350" width="130" height="44" rx="10" fill="#ffffff" opacity="0.06"/>
    <text x="1035" y="377" text-anchor="middle">Scrabble</text>
    <rect x="760" y="405" width="160" height="44" rx="10" fill="#ffffff" opacity="0.06"/>
    <text x="840" y="432" text-anchor="middle">Word Lists</text>
    <rect x="930" y="405" width="170" height="44" rx="10" fill="#ffffff" opacity="0.06"/>
    <text x="1015" y="432" text-anchor="middle">Dictionary</text>
  </g>

  <!-- URL footer -->
  <text x="100" y="595" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#71717a">
    wordizy.com
  </text>
</svg>
